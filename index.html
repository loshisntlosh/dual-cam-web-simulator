<!-- En el Header (junto al selector de calidad) -->
<div class="app-header">
    <button id="btn-quality" class="icon-btn">4K · 30</button>
    <div id="rec-indicator" class="indicator">DUAL LIVE</div>
    <!-- Nuevo Botón de Ajustes -->
    <button id="btn-settings-toggle" class="icon-btn-gear">⚙️</button>
</div>

<!-- Panel de Ajustes Estilo iOS (Modal Oculto por defecto) -->
<div id="settings-modal" class="settings-modal hidden">
    <div class="settings-content">
        <div class="settings-header">
            <h3>Ajustes de Cámara</h3>
            <button id="btn-close-settings">✕</button>
        </div>
        
        <div class="settings-section">
            <span class="section-title">COMPOSICIÓN Y ORIENTACIÓN</span>
            
            <div class="setting-item">
                <span>Cuadrícula (Regla de Tercios)</span>
                <label class="switch">
                    <input type="checkbox" id="chk-grid" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-item">
                <span>Espejo Cámara Frontal</span>
                <label class="switch">
                    <input type="checkbox" id="chk-mirror" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <div class="settings-section">
            <span class="section-title">VIDEO Y GRABACIÓN</span>
            
            <div class="setting-item">
                <span>Audio Estéreo Avanzado</span>
                <label class="switch">
                    <input type="checkbox" id="chk-audio" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-item">
                <span>Bloqueo de Exposición al Grabar</span>
                <label class="switch">
                    <input type="checkbox" id="chk-lock-exposure">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
    </div>
</div>
