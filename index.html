<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualCam Simulator</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DualCam">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <button id="btn-quality" class="icon-btn">HD / 1080p</button>
            <div class="indicator">● LIVE DUAL</div>
            <button id="btn-switch" class="icon-btn">🔄</button>
        </header>

        <!-- Visor Simultáneo: Vertical y Horizontal al mismo tiempo -->
        <main class="camera-viewport">
            <!-- Video fuente oculto que procesa la cámara real -->
            <video id="camera-source" autoplay playsinline muted style="display: none;"></video>

            <!-- Vista 1: Marco Vertical -->
            <div class="feed-container vertical-feed">
                <canvas id="canvas-vertical"></canvas>
                <span class="feed-label">Vertical</span>
            </div>

            <!-- Vista 2: Marco Horizontal (Simultáneo abajo) -->
            <div class="feed-container horizontal-feed">
                <canvas id="canvas-horizontal"></canvas>
                <span class="feed-label">Horizontal</span>
            </div>
        </main>

        <footer class="app-footer">
            <div class="gallery-preview" id="gallery-trigger">
                <span id="gallery-icon">📁</span>
            </div>

            <div class="shutter-controls">
                <button id="btn-shutter" class="shutter-btn"></button>
            </div>

            <div class="mode-selector">
                <span class="active-mode">FOTO</span>
            </div>
        </footer>

    </div>

    <script src="assets/js/camera.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
